[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-learner"
version = "0.1.0"
description = "Da un video tutorial YouTube a una SKILL eseguibile + una scheda KNOWLEDGE per il brain di un agente."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.8.6",
    "youtube-transcript-api>=0.6.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.34.0"]
all = ["google-genai>=1.0.0", "openai>=1.40.0", "anthropic>=0.34.0"]

[project.scripts]
yt-learner = "yt_learner.main:main"

[tool.setuptools]
packages = ["yt_learner"]
